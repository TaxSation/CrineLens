version: '3.8'

services:
  crimelens-app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DATA_DIR=/app/data/raw
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    restart: unless-stopped
